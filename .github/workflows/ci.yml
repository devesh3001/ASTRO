name: AeroSentinel CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install verified runtime dependencies
        run: pip install --require-hashes -r requirements.lock
      - name: Baseline integration and regression tests
        run: |
          python tests/test_physics.py
          python -m unittest tests.test_adversarial tests.test_hardening tests.test_packaging tests.test_mission_planning tests.test_seeds_extended
      - name: Compare scripted radio policies on separate seeds
        run: python scripts/benchmark_policies.py --tasks rf_energy_tradeoff --seeds 100 101 102
      - name: Measure isolated cold build
        run: python scripts/check_cold_build.py
      - name: Run all-task gates and offline solver
        run: MODE=all MODEL=mock/solver docker compose up --build --abort-on-container-exit --exit-code-from harness
      - name: Run live isolation and process/resource regressions
        run: |
          docker compose up -d sandbox
          docker compose run --rm -v "${PWD}/tests:/app/tests:ro" -e FAIL_ON_UNAVAILABLE=1 harness python -m unittest tests.test_docker_security
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aerosentinel-validation
          path: logs/
