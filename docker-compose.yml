# One command builds everything and runs the whole flow:
#
#   docker compose up --build --abort-on-container-exit --exit-code-from harness
#
# Inside the harness container the order is: oracle check -> no-op check -> model run.

name: aerosentinel

services:
  sandbox:                       # where the agent's tools run (no internet)
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    networks: [isolated]         # internal network only: no internet access
    init: true                   # forwards SIGTERM cleanly
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]  # allows privilege separation and workspace management
    security_opt: ["no-new-privileges:false"]
    pids_limit: 256
    mem_limit: 512m
    environment:
      HARNESS_SECRET: ${HARNESS_SECRET:-}
      WORKSPACE_DIR: /workspace
      PORT: 8000
    volumes:
      - auth_tokens:/run/aerosentinel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  harness:                       # verifier, baselines and model loop
    build:
      context: .
      dockerfile: Dockerfile.harness
    depends_on:
      sandbox:
        condition: service_healthy
    networks: [isolated, internet]   # reaches sandbox (isolated) and model API (internet)
    environment:
      MODEL: ${MODEL:-mock/solver}
      API_KEY: ${API_KEY:-}
      BASE_URL: ${BASE_URL:-}
      MAX_TOKENS: ${MAX_TOKENS:-}
      TASK_ID: ${TASK_ID:-eps_eclipse_recovery}
      SEED: ${SEED:-0}
      MODE: ${MODE:-full}
      APPEND_FILE: ${APPEND_FILE:-}
      SANDBOX_URL: http://sandbox:8000
      HARNESS_SECRET: ${HARNESS_SECRET:-}
    volumes:
      - auth_tokens:/run/aerosentinel:ro
      - ./logs:/app/logs
      - ./inputs:/app/inputs:ro

volumes:
  auth_tokens:                   # private in-memory communication volume for dynamic auth token

networks:
  isolated:
    internal: true               # no route to the internet
  internet: {}
