# One command builds everything and runs the whole flow:
#
#   docker compose up --build --abort-on-container-exit --exit-code-from harness
#
# Inside the harness container the order is: oracle check -> no-op check -> model run.

name: aerosentinel

services:
  sandbox:                       # where the agent's tools run
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    networks: [isolated]         # internal network only: no internet access
    init: true                   # forwards SIGTERM so the sandbox stops cleanly
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30

  harness:                       # verifier, baselines and the model loop
    build:
      context: .
      dockerfile: Dockerfile.harness
    depends_on:
      sandbox:
        condition: service_healthy
    networks: [isolated, internet]   # can reach the sandbox and the model API
    environment:
      MODEL: ${MODEL:-mock/solver}
      API_KEY: ${API_KEY:-}
      BASE_URL: ${BASE_URL:-}
      MAX_TOKENS: ${MAX_TOKENS:-}
      TASK_ID: ${TASK_ID:-power_brownout}
      SEED: ${SEED:-0}
      MODE: ${MODE:-full}
      APPEND_FILE: ${APPEND_FILE:-}
      SANDBOX_URL: http://sandbox:8000
    volumes:
      - ./logs:/app/logs
      - ./inputs:/app/inputs:ro

networks:
  isolated:
    internal: true               # no route to the internet
  internet: {}
